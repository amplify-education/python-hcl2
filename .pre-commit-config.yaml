---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        exclude: ^test/integration/(hcl2_reconstructed|specialized)/
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: no-commit-to-branch  # Prevent commits directly to master
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.28.0
    hooks:
      - id: yamllint
        name: Lint YAML
        args: [--format, parsable, --strict]
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.2  # or specific tag
    hooks:
      - id: yamlfmt
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '120']
  - repo: https://github.com/executablebooks/mdformat.git
    rev: 0.7.16
    hooks:
      - id: mdformat
        name: Format markdown
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v0.991    # Use the sha / tag you want to point at
    hooks:
      - id: mypy
        # Pinned so the hook's own venv can build typed-ast, which has no
        # wheel for Python 3.12+; this only affects mypy's own interpreter,
        # not the --python-version it type-checks against.
        language_version: python3.11
